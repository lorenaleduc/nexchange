<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dashboard | NEXCHANGE</title>

  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/sidebar.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/assets.css">
  <link rel="stylesheet" href="../css/rules.css">
</head>

<body>

  <div class="app-screen">

    <aside class="sidebar">

      <div class="sidebar-brand">

        <span class="brand-mark">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <rect x="1" y="10" width="3.4" height="7" rx="1" fill="#04130d"></rect>
            <rect x="7.3" y="5" width="3.4" height="12" rx="1" fill="#04130d"></rect>
            <rect x="13.6" y="1" width="3.4" height="16" rx="1" fill="#04130d"></rect>
          </svg>
        </span>

        <div>
          <strong>NEXCHANGE</strong>
          <small>
            Simulador de investimentos
          </small>
        </div>

      </div>

      <nav class="sidebar-nav">

        <a href="#inicio" class="active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 11.5 12 4l8 7.5"></path>
            <path d="M6 10v9a1 1 0 0 0 1 1h3v-6h4v6h3a1 1 0 0 0 1-1v-9"></path>
          </svg>
          <span>Início</span>
        </a>

        <a href="#mercado">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
            <path d="M5 19V13"></path>
            <path d="M12 19V8"></path>
            <path d="M19 19V5"></path>
          </svg>
          <span>Mercado</span>
        </a>

        <a href="#regras">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
            <path d="M4 7h9"></path>
            <circle cx="16" cy="7" r="2"></circle>
            <path d="M4 17h4"></path>
            <circle cx="11" cy="17" r="2"></circle>
            <path d="M14 17h6"></path>
          </svg>
          <span>Regras</span>
        </a>

        <a href="#historico">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="8"></circle>
            <path d="M12 8v4l3 2"></path>
          </svg>
          <span>Histórico</span>
        </a>

      </nav>

      <div class="sidebar-footer">

        <button id="logout-button" type="button">
          Sair
        </button>

      </div>

    </aside>

    <main class="dashboard">

      <header class="dashboard-header" id="inicio">

        <div>

          <span id="user-role">
            PAINEL DO INVESTIDOR
          </span>

          <h1>
            Olá,
            <span id="user-first-name"></span>
          </h1>

          <p>
            Acompanhe seus investimentos e configure
            suas regras.
          </p>

        </div>

        <div class="profile">

          <div class="avatar" id="avatar">
            NX
          </div>

          <div class="profile-info">

            <strong id="profile-name">
              Usuário
            </strong>

            <small id="profile-type">
              Perfil moderado
            </small>

          </div>

          <button id="edit-profile-button" type="button">
            Editar perfil
          </button>

        </div>

      </header>

      <div id="overview-container"></div>

      <div id="mercado-container"></div>

      <div id="admin-assets-container"></div>

      <div id="admin-users-container"></div>

      <div id="regras-container"></div>

      <div id="historico-container"></div>

    </main>

  </div>

  <div id="profile-modal" class="modal hidden">

    <div class="modal-card">

      <div class="modal-header">

        <div>

          <span class="section-label">
            PERFIL
          </span>

          <h2>
            Editar perfil
          </h2>

        </div>

        <button id="close-profile-modal" type="button" class="modal-close">
          ×
        </button>

      </div>

      <form id="profile-form">

        <div class="form-group">

          <label for="profile-input-name">
            Nome
          </label>

          <input id="profile-input-name" type="text" required>

        </div>

        <div class="form-group">

          <label for="profile-input-email">
            E-mail
          </label>

          <input id="profile-input-email" type="email" required>

        </div>

        <div class="form-group">

          <label for="profile-input-password">
            Nova senha
          </label>

          <input id="profile-input-password" type="password" placeholder="Deixe vazio para manter a atual">

        </div>

        <button class="primary-button" type="submit">
          Salvar alterações
        </button>

      </form>

    </div>

  </div>

  <div id="admin-user-modal" class="modal hidden">

    <div class="modal-card">

      <div class="modal-header">

        <div>

          <span class="section-label">
            USUÁRIO
          </span>

          <h2>
            Editar usuário
          </h2>

        </div>

        <button id="close-admin-user-modal" type="button" class="modal-close">
          ×
        </button>

      </div>

      <form id="admin-user-form">

        <div class="form-group">

          <label for="admin-user-name">
            Nome
          </label>

          <input id="admin-user-name" type="text" required>

        </div>

        <div class="form-group">

          <label for="admin-user-email">
            E-mail
          </label>

          <input id="admin-user-email" type="email" required>

        </div>

        <div class="form-group">

          <label for="admin-user-password">
            Nova senha
          </label>

          <input id="admin-user-password" type="password" placeholder="Deixe vazio para manter a atual">

        </div>

        <button class="primary-button" type="submit">
          Salvar alterações
        </button>

      </form>

    </div>

  </div>

  <div id="toast" class="toast"></div>

  <script src="../js/storage.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/usuarios.js"></script>
  <script src="../js/ativos.js"></script>
  <script src="../js/regras.js"></script>
  <script src="../js/sections.js"></script>

</body>

</html>
