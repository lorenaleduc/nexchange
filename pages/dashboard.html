<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dashboard | NEXCHANGE</title>

  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/sidebar.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/assets.css">
  <link rel="stylesheet" href="../css/rules.css">
</head>

<body>

  <div class="app-screen">

    <aside class="sidebar">

      <div class="sidebar-brand">

        <span class="brand-mark">
          N
        </span>

        <div>
          <strong>NEXCHANGE</strong>
          <small>
            Simulador de investimentos
          </small>
        </div>

      </div>

      <nav class="sidebar-nav">

        <a
          href="#inicio"
          class="active"
        >
          Início
        </a>

        <a href="#mercado">
          Mercado
        </a>

        <a href="#regras">
          Regras
        </a>

        <a href="#historico">
          Histórico
        </a>

      </nav>

      <div class="sidebar-footer">

        <button
          id="logout-button"
          type="button"
        >
          Sair
        </button>

      </div>

    </aside>

    <main class="dashboard">

      <header
        class="dashboard-header"
        id="inicio"
      >

        <div>

          <span id="user-role">
            PAINEL DO INVESTIDOR
          </span>

          <h1>
            Olá,
            <span id="user-first-name"></span>
          </h1>

          <p>
            Acompanhe seus investimentos e configure
            suas regras.
          </p>

        </div>

        <div class="profile">

          <div
            class="avatar"
            id="avatar"
          >
            NX
          </div>

          <div class="profile-info">

            <strong id="profile-name">
              Usuário
            </strong>

            <small id="profile-type">
              Perfil moderado
            </small>

          </div>

          <button
            id="edit-profile-button"
            type="button"
          >
            Editar perfil
          </button>

        </div>

      </header>

      <div id="overview-container"></div>

      <div id="mercado-container"></div>

      <div id="admin-assets-container"></div>

      <div id="admin-users-container"></div>

      <div id="regras-container"></div>

      <div id="historico-container"></div>

    </main>

  </div>

  <div
    id="profile-modal"
    class="modal hidden"
  >

    <div class="modal-card">

      <div class="modal-header">

        <div>

          <span class="section-label">
            PERFIL
          </span>

          <h2>
            Editar perfil
          </h2>

        </div>

        <button
          id="close-profile-modal"
          type="button"
          class="modal-close"
        >
          ×
        </button>

      </div>

      <form id="profile-form">

        <div class="form-group">

          <label for="profile-input-name">
            Nome
          </label>

          <input
            id="profile-input-name"
            type="text"
            required
          >

        </div>

        <div class="form-group">

          <label for="profile-input-email">
            E-mail
          </label>

          <input
            id="profile-input-email"
            type="email"
            required
          >

        </div>

        <div class="form-group">

          <label for="profile-input-password">
            Nova senha
          </label>

          <input
            id="profile-input-password"
            type="password"
            placeholder="Deixe vazio para manter a atual"
          >

        </div>

        <button
          class="primary-button"
          type="submit"
        >
          Salvar alterações
        </button>

      </form>

    </div>

  </div>

  <div
    id="admin-user-modal"
    class="modal hidden"
  >

    <div class="modal-card">

      <div class="modal-header">

        <div>

          <span class="section-label">
            USUÁRIO
          </span>

          <h2>
            Editar usuário
          </h2>

        </div>

        <button
          id="close-admin-user-modal"
          type="button"
          class="modal-close"
        >
          ×
        </button>

      </div>

      <form id="admin-user-form">

        <div class="form-group">

          <label for="admin-user-name">
            Nome
          </label>

          <input
            id="admin-user-name"
            type="text"
            required
          >

        </div>

        <div class="form-group">

          <label for="admin-user-email">
            E-mail
          </label>

          <input
            id="admin-user-email"
            type="email"
            required
          >

        </div>

        <div class="form-group">

          <label for="admin-user-password">
            Nova senha
          </label>

          <input
            id="admin-user-password"
            type="password"
            placeholder="Deixe vazio para manter a atual"
          >

        </div>

        <button
          class="primary-button"
          type="submit"
        >
          Salvar alterações
        </button>

      </form>

    </div>

  </div>

  <div
    id="toast"
    class="toast"
  ></div>

  <script src="../js/storage.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/usuarios.js"></script>
  <script src="../js/ativos.js"></script>
  <script src="../js/regras.js"></script>
  <script src="../js/sections.js"></script>

</body>

</html>
