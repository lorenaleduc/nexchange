<section class="dashboard-section" id="regras">
  <div class="section-header">
    <div>
      <span class="section-label">
        AUTOMAÇÃO
      </span>

      <h2>
        Regras de investimento
      </h2>

      <p>
        Configure condições para acompanhar
        oportunidades de investimento.
      </p>
    </div>

    <span id="contador-regras">
      0 regra(s)
    </span>
  </div>

  <div class="rules-layout">
    <form id="form-regra" class="panel-form">
      <input
        type="hidden"
        id="regra-id"
      >

      <div class="form-group">
        <label for="ativo">
          Ativo
        </label>

        <select
          id="ativo"
          required
        ></select>

        <small id="preco-atual"></small>
      </div>

      <div class="form-group">
        <label for="preco-alvo">
          Preço-alvo
        </label>

        <input
          id="preco-alvo"
          type="number"
          min="0.01"
          step="0.01"
          placeholder="0,00"
          required
        >
      </div>

      <div class="form-group">
        <label for="valor">
          Valor limite
        </label>

        <input
          id="valor"
          type="number"
          min="0.01"
          step="0.01"
          placeholder="0,00"
          required
        >
      </div>

      <label class="checkbox-field">
        <input
          id="notificar"
          type="checkbox"
        >

        Receber notificação
      </label>

      <div class="form-actions">
        <button
          id="regra-submit"
          class="primary-button"
          type="submit"
        >
          Criar regra
        </button>

        <button
          id="regra-cancelar"
          class="secondary-button hidden"
          type="button"
        >
          Cancelar edição
        </button>
      </div>
    </form>

    <div
      class="rules-list"
      id="lista-regras"
    ></div>
  </div>
</section>
