<section class="summary-grid">
  <article class="summary-card">
    <span>
      Saldo disponível
    </span>

    <strong id="saldo">
      R$ 0,00
    </strong>

    <small>
      Saldo simulado
    </small>
  </article>

  <article class="summary-card">
    <span>
      Valor reservado
    </span>

    <strong id="reservado">
      R$ 0,00
    </strong>

    <small>
      Reservado pelas regras
    </small>
  </article>

  <article class="summary-card">
    <span>
      Regras
    </span>

    <strong id="regras-resumo">
      Nenhuma regra ativa
    </strong>

    <small>
      Regras de investimento
    </small>
  </article>

  <article class="summary-card">
    <span>
      Automação
    </span>

    <div class="automation-control">
      <label class="switch">
        <input
          id="automacao"
          type="checkbox"
        >

        <span class="slider"></span>
      </label>

      <strong id="automacao-status">
        Desativada
      </strong>
    </div>

    <small>
      Simulação automática
    </small>
  </article>
</section>
