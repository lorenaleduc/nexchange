<section class="summary-grid">

  <article class="summary-card summary-card--balance">
    <span>
      Saldo disponível
    </span>

    <strong id="saldo">
      R$ 0,00
    </strong>

    <small>
      Disponível para investimento
    </small>
  </article>

  <article class="summary-card summary-card--reserved">
    <span>
      Valor reservado
    </span>

    <strong id="reservado">
      R$ 0,00
    </strong>

    <small>
      Reservado pelas regras
    </small>
  </article>

  <article class="summary-card summary-card--rules">
    <span>
      Regras
    </span>

    <strong id="regras-resumo">
      Nenhuma regra ativa
    </strong>

    <small>
      Regras de investimento
    </small>
  </article>

  <article class="summary-card summary-card--automation">
    <span>
      Automação
    </span>

    <div class="automation-control">

      <label class="switch">
        <input id="automacao" type="checkbox">
        <span class="slider"></span>
      </label>

      <strong id="automacao-status">
        Desativada
      </strong>

    </div>

    <small>
      Execução automática
    </small>
  </article>

</section>
