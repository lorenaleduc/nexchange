<section class="dashboard-section" id="historico">
  <div class="section-header">
    <div>
      <span class="section-label">
        ATIVIDADES
      </span>

      <h2>
        Histórico
      </h2>

      <p>
        Acompanhe as atividades realizadas no simulador.
      </p>
    </div>

    <button
      id="limpar-historico"
      class="secondary-button"
      type="button"
    >
      Limpar histórico
    </button>
  </div>

  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th>Data</th>
          <th>Ativo</th>
          <th>Ação</th>
          <th>Detalhes</th>
        </tr>
      </thead>

      <tbody id="historico-corpo"></tbody>
    </table>
  </div>
</section>
